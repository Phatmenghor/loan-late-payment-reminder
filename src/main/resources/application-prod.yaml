# Production Configuration
server:
  port: ${SERVER_PORT:9393}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.103.106}:${DB_PORT:5432}/${DB_NAME:loan_reminder}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

# Authentication
auth:
  username: ${AUTH_USERNAME}
  password: ${AUTH_PASSWORD}

# CPB API Configuration
cpb:
  api:
    url: ${API_URL:http://192.168.103.11:9393}
    encryption-key: ${ENCRYPTION_KEY}

# Oracle Database Configuration
datasource:
  oracle:
    url: ${ORACLE_URL:jdbc:oracle:thin:@192.168.102.5:1521:dwh}
    username: ${ORACLE_USERNAME:dwh}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver
    maximum-pool-size: 10
    minimum-idle: 3
    connection-timeout: 20000
    idle-timeout: 300000

logging:
  level:
    root: WARN
    com.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
