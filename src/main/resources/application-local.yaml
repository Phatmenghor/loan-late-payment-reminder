# Local Development Configuration (overrides base application.yaml)

server:
  port: ${SERVER_PORT:9393}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loan_reminder}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123cp!@#}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create

# Authentication
auth:
  username: ${AUTH_USERNAME:admin}
  password: ${AUTH_PASSWORD:admin123}

# CPB API Configuration
cpb:
  api:
    url: ${API_URL:http://localhost:9393}
    encryption-key: ${ENCRYPTION_KEY:OTTCPB!!BBDUNG#LOGFH$837990}

logging:
  level:
    root: INFO
    com.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
