# Local Development Configuration
server:
  port: ${SERVER_PORT:9393}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loan_reminder}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Authentication
auth:
  username: ${AUTH_USERNAME:admin}
  password: ${AUTH_PASSWORD:admin123}

# CPB API Configuration
cpb:
  api:
    url: ${API_URL:http://localhost:9393}
    encryption-key: ${ENCRYPTION_KEY:OTTCPB!!BBDUNG#LOGFH$837990}

# Oracle Database Configuration
datasource:
  oracle:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521:xe}
    username: ${ORACLE_USERNAME:system}
    password: ${ORACLE_PASSWORD:oracle}
    driver-class-name: oracle.jdbc.driver.OracleDriver
    maximum-pool-size: 3
    minimum-idle: 1
    connection-timeout: 20000
    idle-timeout: 300000

logging:
  level:
    root: INFO
    com.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
