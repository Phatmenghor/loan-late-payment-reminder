# Local Development Configuration
# Uses localhost PostgreSQL
# Override via environment variables: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD

server:
  port: ${SERVER_PORT:9393}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:k_hourng_cambodia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Hour1819}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# CPB API Configuration for Local
cpb:
  api:
    url: ${API_URL:http://10.18.1.47:9393}
    encryption-key: ${ENCRYPTION_KEY:OTTCPB!!BBDUNG#LOGFH$837990}

logging:
  level:
    root: INFO
    com.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
