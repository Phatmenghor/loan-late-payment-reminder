# Local Development Configuration (H2 in-memory, no external dependencies)

server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

# Authentication
app:
  auth:
    username: admin
    password: admin123

# CPB API Configuration
cpb:
  api:
    url: http://10.18.1.47:9393
    encryption-key: OTTCPB!!BBDUNG#LOGFH$837990
    username: admin
    password: admin123

# Oracle Database Configuration (disabled for local)
datasource:
  oracle:
    enabled: false

logging:
  level:
    root: INFO
    com.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
