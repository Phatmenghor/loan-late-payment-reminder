# ============================================================
# application.yaml  –  BASE CONFIG (shared across all profiles)
# ============================================================
# To switch environment:
#   profiles.active: local   →  localhost DB, debug logging
#   profiles.active: dev     →  dev server DB
#   profiles.active: prod    →  production DB, minimal logging
# ============================================================
spring:
  application:
    name: loan-late-payment-reminder
  profiles:
    active: prod # ← change to "local" or "dev" as needed

  # JPA  – common settings (ddl-auto overridden per profile)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

# Server
server:
  port: 8080

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# Application
app:
  name: "Loan Late Payment Reminder"
  version: "1.0.0"
  description: "SMS notification system for loan late payment reminders"

# Authentication
auth:
  username: "admin"
  password: "admin123"

# CPB API Configuration
cpb:
  api:
    url: "http://localhost:8080"

# Notification Configuration
notification:
  sms:
    enabled: true
    api-endpoint: "/SendOTT"
    timeout-seconds: 30

# Oracle Database Configuration (Secondary - for reading data)
datasource:
  oracle:
    url: "jdbc:oracle:thin:@192.168.102.5:1521:dwh"
    username: "dwh"
    password: "Bnk$$444"
    driver-class-name: "oracle.jdbc.driver.OracleDriver"
    maximum-pool-size: 5
    minimum-idle: 2
    connection-timeout: 20000
    idle-timeout: 300000
