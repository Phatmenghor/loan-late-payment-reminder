# ============================================================
# application.yaml  –  SHARED BASE CONFIG (all profiles)
# ============================================================
# Profile-specific files (application-{profile}.yaml) override
# these settings. To change profile: active: local | dev | prod
# ============================================================

spring:
  application:
    name: internal-service
  profiles:
    active: prod

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

app:
  name: "Internal Service"
  version: "1.0.0"
  description: "Internal AD Auth & Notification Service"
  notification:
    batch-size: 20
    max-threads: 10
