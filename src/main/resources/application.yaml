# ============================================================
# application.yaml  –  BASE CONFIG (shared across all profiles)
# ============================================================
# To switch environment:
#   profiles.active: local   →  localhost DB, debug logging
#   profiles.active: dev     →  dev server DB
#   profiles.active: prod    →  production DB, minimal logging
# ============================================================
spring:
  application:
    name: sms-loan-late
  profiles:
    active: dev # ← change to "local" or "dev" as needed

  # PostgreSQL (Primary datasource - auto-configured by Spring Boot)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loan_reminder}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA  – common settings (ddl-auto overridden per profile)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

  # Flyway
  flyway:
    enabled: false

# Server
server:
  port: ${SERVER_PORT:9393}

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# Application
app:
  name: "Loan Late Payment Reminder"
  version: "1.0.0"
  description: "SMS notification system for loan late payment reminders"
