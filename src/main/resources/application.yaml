# ============================================================
# application.yaml  –  SHARED BASE CONFIG (all profiles)
# ============================================================
# Profile-specific files (application-{profile}.yaml) override
# these settings. To change profile: active: local | dev | prod
# ============================================================

spring:
  application:
    name: sms-loan-late
  profiles:
    active: dev

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

  flyway:
    enabled: false

  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:9393}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

app:
  name: "Loan Late Payment Reminder"
  version: "1.0.0"
  description: "SMS notification system for loan late payment reminders"
